<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="How the loading controller picks a recompute ratio and a storage device"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"></path></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"></path></marker>
<marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"></path></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"></path></marker></defs><rect width="960" height="470" fill="#fff"></rect><text x="15" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Inputs</text><rect x="15" y="44" width="220" height="28" rx="3" fill="#fff" stroke="#d1d5db" stroke-width="1"></rect><text x="27" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">model (offline profiled prefill cost)</text><rect x="15" y="82" width="220" height="28" rx="3" fill="#fff" stroke="#d1d5db" stroke-width="1"></rect><text x="27" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">context length L</text><rect x="15" y="120" width="220" height="28" rx="3" fill="#fff" stroke="#d1d5db" stroke-width="1"></rect><text x="27" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">device throughput (measured offline)</text><rect x="15" y="158" width="220" height="28" rx="3" fill="#fff" stroke="#d1d5db" stroke-width="1"></rect><text x="27" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">storage price per GB</text><path d="M235,86 L280,86" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></path><path d="M235,124 L280,124" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></path><rect x="288" y="44" width="300" height="116" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.4"></rect><text x="302" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">Recompute delay estimator</text><text x="302" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">T_recompute(r, LLM, L)</text><text x="302" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">  = r% x Prefill(LLM, L)</text><text x="302" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">Load delay estimator</text><text x="302" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">T_load = PerTokenKV(LLM) x L / throughput</text><path d="M588,99 L636,99" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></path><rect x="636" y="44" width="308" height="116" rx="4" fill="#fff" stroke="#111827" stroke-width="1.4"></rect><text x="650" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Question 1: the device is fixed</text><text x="650" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">pick r so that T_recompute = T_load</text><text x="650" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">then r = max(r, r*),  r* = 15%</text><text x="650" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">r* is the floor that protects quality</text><path d="M790,160 L790,200" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></path><rect x="636" y="200" width="308" height="54" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"></rect><text x="650" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">The ratio the fusor will use</text><text x="650" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">no added TTFT, no quality loss</text><rect x="15" y="222" width="560" height="122" rx="4" fill="#fff" stroke="#111827" stroke-width="1.4"></rect><text x="29" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Question 2: the recompute ratio is fixed at 15%</text><text x="29" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">for each candidate device, estimate T_load and C_store(LLM, L, T, device)</text><text x="29" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">keep the devices where T_recompute is at least T_load</text><text x="29" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">then choose the cheapest survivor</text><text x="29" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#2563eb" text-anchor="start">CPU RAM  -&gt;  NVMe SSD  -&gt;  slower disk  -&gt;  object store</text><path d="M295,344 L295,386" fill="none" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></path><rect x="140" y="386" width="310" height="54" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"></rect><text x="154" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">Cheapest device with no extra delay</text><text x="154" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">more KV cache stored per dollar</text><text x="636" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">Both questions run on the same two</text><text x="636" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">estimators. One solves for r given a</text><text x="636" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">device, the other for a device given r.</text></svg>