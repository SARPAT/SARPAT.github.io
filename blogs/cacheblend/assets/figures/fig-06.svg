<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Per-layer timeline of KV loading overlapped with selective recompute"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"></path></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"></path></marker>
<marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"></path></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"></path></marker></defs><rect width="960" height="450" fill="#fff"></rect><text x="15" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">(a) Llama-7B, 4K context, NVMe SSD</text><text x="15" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">recompute takes 3 ms per layer, the load 16 ms, so recompute is fully hidden</text><text x="178" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#2563eb" text-anchor="end">KV load (SSD)</text><text x="178" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="end">Selective recompute</text><rect x="190" y="66" width="113.2" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="246.6" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">load layer 1</text><rect x="305.2" y="66" width="113.2" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="361.8" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">load layer 2</text><rect x="420.4" y="66" width="113.2" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="477" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">load layer 3</text><rect x="535.6" y="66" width="113.2" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="592.2" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">load layer 4</text><rect x="650.8" y="66" width="113.2" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="707.4" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">load layer 5</text><rect x="305.2" y="102" width="19.6" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="316" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L1</text><path d="M301.2,86 L307.2,100" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ag)"></path><rect x="420.4" y="102" width="19.6" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="431.2" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L2</text><path d="M416.4,86 L422.4,100" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ag)"></path><rect x="535.6" y="102" width="19.6" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="546.4" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L3</text><path d="M531.6,86 L537.6,100" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ag)"></path><rect x="650.8" y="102" width="19.6" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="661.5999999999999" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L4</text><path d="M646.8,86 L652.8,100" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ag)"></path><text x="190" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">Layer i is recomputed while layer i+1 is still loading, so TTFT is set by loading alone.</text><line x1="190" y1="164" x2="802" y2="164" stroke="#6b7280" stroke-width="1"></line><line x1="190" y1="164" x2="190" y2="169" stroke="#6b7280"></line><text x="190" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">0 ms</text><line x1="305.2" y1="164" x2="305.2" y2="169" stroke="#6b7280"></line><text x="305.2" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">16 ms</text><line x1="420.4" y1="164" x2="420.4" y2="169" stroke="#6b7280"></line><text x="420.4" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">32 ms</text><line x1="535.6" y1="164" x2="535.6" y2="169" stroke="#6b7280"></line><text x="535.6" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">48 ms</text><line x1="650.8" y1="164" x2="650.8" y2="169" stroke="#6b7280"></line><text x="650.8" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">64 ms</text><line x1="766" y1="164" x2="766" y2="169" stroke="#6b7280"></line><text x="766" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">80 ms</text><text x="15" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111827" text-anchor="start">(b) Llama-70B, 4K context, NVMe SSD</text><text x="15" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">recompute takes 7 ms per layer, the load only 4 ms, so part of the recompute is exposed</text><text x="178" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#2563eb" text-anchor="end">KV load (SSD)</text><text x="178" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="end">Selective recompute</text><rect x="190" y="278" width="26.8" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="204.4" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2563eb" text-anchor="middle">ld 1</text><rect x="218.8" y="314" width="48.4" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="244" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L1</text><rect x="240.4" y="278" width="26.8" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="254.8" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2563eb" text-anchor="middle">ld 2</text><rect x="269.2" y="314" width="48.4" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="294.4" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L2</text><rect x="290.8" y="278" width="26.8" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="305.2" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2563eb" text-anchor="middle">ld 3</text><rect x="319.6" y="314" width="48.4" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="344.8" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L3</text><rect x="341.20000000000005" y="278" width="26.8" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="355.6" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2563eb" text-anchor="middle">ld 4</text><rect x="370.00000000000006" y="314" width="48.4" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="395.20000000000005" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L4</text><rect x="391.6" y="278" width="26.8" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"></rect><text x="406" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2563eb" text-anchor="middle">ld 5</text><rect x="420.40000000000003" y="314" width="48.4" height="20" rx="2" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="445.6" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#b91c1c" text-anchor="middle">L5</text><text x="485.2" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">loader idles, waiting on compute</text><text x="190" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#b45309" text-anchor="start">Recompute now sets the pace, so the controller lowers r or moves the cache to a slower, cheaper device.</text><line x1="190" y1="380" x2="802" y2="380" stroke="#6b7280" stroke-width="1"></line><line x1="190" y1="380" x2="190" y2="385" stroke="#6b7280"></line><text x="190" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">0 ms</text><line x1="305.2" y1="380" x2="305.2" y2="385" stroke="#6b7280"></line><text x="305.2" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">16 ms</text><line x1="420.4" y1="380" x2="420.4" y2="385" stroke="#6b7280"></line><text x="420.4" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">32 ms</text><line x1="535.6" y1="380" x2="535.6" y2="385" stroke="#6b7280"></line><text x="535.6" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">48 ms</text><line x1="650.8" y1="380" x2="650.8" y2="385" stroke="#6b7280"></line><text x="650.8" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">64 ms</text><line x1="766" y1="380" x2="766" y2="385" stroke="#6b7280"></line><text x="766" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">80 ms</text><text x="15" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">Per-layer numbers are the paper&#39;s measurements on one A40 with a 4.8 GB/s NVMe SSD. Bars are drawn to scale.</text></svg>