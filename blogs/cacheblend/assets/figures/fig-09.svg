<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Sequence of one CacheBlend request from query to answer"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"></path></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"></path></marker>
<marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"></path></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"></path></marker></defs><rect width="960" height="520" fill="#fff"></rect><text x="60" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">User</text><line x1="60" y1="48" x2="60" y2="468" stroke="#d1d5db" stroke-width="1"></line><text x="210" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">Retriever</text><line x1="210" y1="48" x2="210" y2="468" stroke="#d1d5db" stroke-width="1"></line><text x="370" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">Loading</text><text x="370" y="41" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">controller</text><line x1="370" y1="60" x2="370" y2="468" stroke="#d1d5db" stroke-width="1"></line><text x="530" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">KV cache</text><text x="530" y="41" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">store</text><line x1="530" y1="60" x2="530" y2="468" stroke="#d1d5db" stroke-width="1"></line><text x="690" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">Fusor</text><line x1="690" y1="48" x2="690" y2="468" stroke="#d1d5db" stroke-width="1"></line><text x="858" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#111827" text-anchor="middle">LLM engine</text><line x1="858" y1="48" x2="858" y2="468" stroke="#d1d5db" stroke-width="1"></line><circle cx="76" cy="73" r="9" fill="#111827"></circle><text x="76" y="76.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="60" y1="86" x2="210" y2="86" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></line><text x="135" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">query</text><circle cx="226" cy="121" r="9" fill="#111827"></circle><text x="226" y="124.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="210" y1="134" x2="370" y2="134" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></line><text x="290" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">top-k chunks</text><text x="290" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">512 tokens each</text><circle cx="386" cy="173" r="9" fill="#111827"></circle><text x="386" y="176.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><line x1="370" y1="186" x2="530" y2="186" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></line><text x="450" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">which chunks are cached?</text><text x="450" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">hash lookup</text><circle cx="514" cy="223" r="9" fill="#111827"></circle><text x="514" y="226.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><line x1="530" y1="236" x2="370" y2="236" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"></line><text x="450" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">hit or miss, and device</text><circle cx="386" cy="269" r="9" fill="#111827"></circle><text x="386" y="272.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><line x1="370" y1="282" x2="690" y2="282" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></line><text x="530" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">recompute ratio r%</text><text x="530" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">from the two estimators</text><circle cx="546" cy="329" r="9" fill="#111827"></circle><text x="546" y="332.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><line x1="530" y1="342" x2="690" y2="342" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ab)"></line><text x="610" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#2563eb" text-anchor="middle">layer i+1 KV loads into GPU</text><rect x="600" y="360" width="180" height="34" rx="3" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.2"></rect><text x="690" y="381" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b91c1c" text-anchor="middle">selective recompute of layer i</text><text x="790" y="381" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#15803d" text-anchor="start">repeats for every layer</text><circle cx="706" cy="415" r="9" fill="#111827"></circle><text x="706" y="418.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">7</text><line x1="690" y1="428" x2="858" y2="428" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"></line><text x="774" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">fused KV cache</text><text x="774" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">engine decodes the answer</text><line x1="858" y1="484" x2="60" y2="484" stroke="#15803d" stroke-width="1.4" marker-end="url(#agr)"></line><text x="460" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#15803d" text-anchor="middle">answer streamed back to the user</text><circle cx="836" cy="470" r="9" fill="#111827"></circle><text x="836" y="473.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="15" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">Steps 6 and 7 overlap: loading layer i+1 and recomputing layer i run on two threads.</text></svg>