M220,124 L262,132" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M195,240 L262,246" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M358,168 L358,208" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M448,290 L502,290" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M448,152 C478,152 486,180 500,206" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M698,270 L760,262" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M852,300 L852,346" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M600,364 C600,420 470,430 372,412" fill="none" stroke="#15803d" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#agr)"></path><path d="M300,392 C300,420 250,424 214,420" fill="none" stroke="#15803d" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#agr)"></path></g><text x="34" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#111827" text-anchor="start">user: &#34;can we use</text><text x="34" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#111827" text-anchor="start">drones in agriculture?&#34;</text><text x="34" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="start">retrieved chunks</text><text x="34" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">drone #1   drone #2</text><text x="34" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">agri  #1   agri  #2</text><text x="34" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">hashed to find their</text><text x="34" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">cached KV</text><text x="282" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">Loading Controller</text><text x="282" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">picks r% and device</text><text x="282" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="start">KV Cache Store</text><text x="300" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#111827" text-anchor="start">CPU RAM</text><text x="300" y="301" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#111827" text-anchor="start">NVMe SSD</text><text x="300" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#111827" text-anchor="start">slower disk</text><text x="522" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">KV Cache Fusor</text><text x="540" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">reused KV</text><text x="540" y="307" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">selective recompute</text><text x="540" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">one layer at a time</text><text x="778" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">LLM inference</text><text x="778" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">engine (vLLM)</text><text x="778" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">fused KV cache in</text><text x="778" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#15803d" text-anchor="start">&#34;drones can ...&#34;</text><text x="778" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">answer</text><text x="388" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#15803d" text-anchor="start">new chunks&#39; KV written back to the store</text><text x="64" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#15803d" text-anchor="start">LRU eviction when the device fills up</text><text x="238" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">CacheBlend</text><text x="480" y="486" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">the engine is unmodified: it receives a KV cache, not text</text></svg>