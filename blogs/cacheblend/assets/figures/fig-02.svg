<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Two chunks and a query where full KV reuse produces a wrong answer"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"></path></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"></path></marker>
<marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"></path></marker>
<filter id="w" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></defs><rect width="960" height="640" fill="#fff"></rect><text x="15" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#111827" text-anchor="start">(a) setup: one query, two relevant chunks</text><text x="15" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">chunk 1</text><text x="325" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">chunk 2</text><text x="635" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">query</text><text x="15" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#111827" text-anchor="start">(b) full KV recompute: prefill over the whole input</text><text x="15" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#111827" text-anchor="start">(c) full KV reuse: concatenate the two precomputed KV caches</text><g filter="url(#w)"><rect x="15" y="42" width="290" height="74" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.6"></rect><rect x="325" y="42" width="290" height="74" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.6"></rect><rect x="635" y="42" width="290" height="74" rx="8" fill="#fff" stroke="#111827" stroke-width="1.6"></rect><rect x="15" y="196" width="270" height="52" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.6"></rect><rect x="15" y="300" width="180" height="44" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="1.6"></rect><rect x="15" y="392" width="540" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"></rect><path d="M150,248 C150,268 150,280 150,296" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M105,344 C105,364 105,376 105,388" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><rect x="15" y="514" width="130" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"></rect><rect x="160" y="514" width="130" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"></rect><rect x="305" y="514" width="120" height="44" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.6"></rect><rect x="450" y="514" width="110" height="44" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="1.6"></rect><rect x="580" y="514" width="345" height="60" rx="8" fill="#fde8e8" stroke="#b91c1c" stroke-width="1.6"></rect><path d="M425,536 C438,536 442,536 446,536" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M560,536 C568,540 570,542 576,543" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M290,536 C295,536 298,536 301,536" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#a)"></path><path d="M80,566 C80,590 150,596 205,580" fill="none" stroke="#15803d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#agr)"></path></g><text x="30" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">&#34;Lionel Messi scored 13</text><text x="30" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">goals at FIFA World</text><text x="30" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">Cups.&#34;</text><text x="340" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">&#34;Cristiano scored 8 goals</text><text x="340" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">at FIFA World Cups.&#34;</text><text x="650" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">&#34;Who scored more goals at</text><text x="650" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">FIFA World Cups, Messi</text><text x="650" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">or Ronaldo?&#34;</text><text x="30" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">chunk 1 + chunk 2 + query</text><text x="30" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">(raw text, full prefill)</text><text x="30" y="327" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">LLM</text><text x="30" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">&#34;Lionel Messi scored more goals at FIFA World Cups</text><text x="30" y="429" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">than Cristiano Ronaldo.&#34;</text><text x="30" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">correct</text><text x="28" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">KV cache 1</text><text x="173" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">KV cache 2</text><text x="316" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">+ query KV</text><text x="478" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">LLM</text><text x="594" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#111827" text-anchor="start">&#34;The question is asking for information about FIFA</text><text x="594" y="549" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#111827" text-anchor="start">World Cups. The names of Messi and Ronaldo are</text><text x="594" y="564" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#111827" text-anchor="start">well-known ...&#34;</text><text x="594" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">rambles, never compares the goal counts</text><text x="150" y="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">cross-attention between chunk 1 and chunk 2 was never computed,</text><text x="150" y="615" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">so the model cannot relate 13 to 8</text></svg>